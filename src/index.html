<!doctype html>
<!--
  Spots: page template.

  This is a *template*, not the final file. During the build,
  HtmlWebpackPlugin (see webpack.config.js) copies it to dist/index.html
  and injects the bundled <script> and <link> tags automatically, so you
  won't see them here.

  The image paths below are wrapped in a require() template tag. That asks
  webpack to include the image in the build and swap in its final URL.
  (Careful: the template engine runs those tags even inside comments,
  so don't write one in a comment.)

  JavaScript finds elements by their class names and ids, so if you rename
  something here, search src/ for it too.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Spots is a responsive photo-sharing profile page — post places you love, like and remove posts, and edit your profile."
    />
    <meta name="author" content="Alejandro Jimenez" />
    <meta name="theme-color" content="#fcf5e5" />
    <meta property="og:title" content="Spots" />
    <meta
      property="og:description"
      content="A responsive photo-sharing profile page built with vanilla JavaScript."
    />
    <meta property="og:type" content="website" />
    <!-- The favicon <link> is also injected by HtmlWebpackPlugin. -->
    <title>Spots — Share the places you love</title>
  </head>
  <body>
    <div class="page">
      <!-- Sticky top bar with the logo -->
      <header class="header">
        <div class="header__inner">
          <img
            src="<%=require('./images/logo.svg')%>"
            alt="Spots"
            class="header__logo"
            width="94"
            height="26"
          />
        </div>
      </header>

      <main class="content">
        <!-- Profile: the name, description and avatar shown here are just
             placeholders; they're replaced with real data from the API
             by UserInfo.setUserInfo() once the page loads. -->
        <section class="profile page__section" aria-label="Profile">
          <div class="profile__avatar-container">
            <img
              src="<%=require('./images/avatar.jpg')%>"
              alt="Profile avatar"
              class="profile__avatar"
              width="190"
              height="190"
            />
            <button
              type="button"
              class="profile__avatar-edit-btn"
              aria-label="Edit avatar"
            >
              <span class="profile__avatar-edit-content">
                <svg
                  class="profile__avatar-edit-icon"
                  viewBox="0 0 24 24"
                  width="24"
                  height="24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path d="M12 20h9" />
                  <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
                </svg>
                Edit avatar
              </span>
            </button>
          </div>
          <div class="profile__column">
            <h1 class="profile__name">Bessie Coleman</h1>
            <p class="profile__description">Civil Aviator</p>
            <button type="button" class="profile__edit-button">
              <svg
                class="profile__edit-icon"
                viewBox="0 0 24 24"
                width="24"
                height="24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <path d="M12 20h9" />
                <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
              </svg>
              Edit profile
            </button>
          </div>
          <button type="button" class="profile__add-button">
            <svg
              class="profile__add-icon"
              viewBox="0 0 24 24"
              width="24"
              height="24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M12 5v14" />
              <path d="M5 12h14" />
            </svg>
            New post
          </button>
        </section>

        <!-- Posts grid. The <ul> starts empty: Section.js fills it with
             loading skeletons, then with cards built from #card-template. -->
        <section class="cards page__section" aria-label="Posts">
          <ul class="cards__list" aria-busy="true"></ul>
          <p class="cards__empty" hidden>
            No posts yet. Share your first spot with the
            <strong>New post</strong> button.
          </p>
        </section>
      </main>

      <!-- The year is updated by pages/index.js -->
      <footer class="footer">
        <p class="footer__copyright">
          &copy; <span class="footer__year">2026</span> Spots · Built by
          Alejandro Jimenez
        </p>
      </footer>
    </div>

    <!--
      Markup for one post. A <template> is never shown on its own; Card.js
      clones it for every card and fills in the image, title and handlers.

      Icons are inline SVGs with stroke="currentColor", so their color comes
      from the CSS `color` property. aria-hidden="true" hides them from
      screen readers, since each button has its own aria-label instead.
    -->
    <template id="card-template">
      <li class="card">
        <div class="card__image-wrapper">
          <img src="#" alt="" class="card__image" loading="lazy" />
          <button
            type="button"
            class="card__delete-button"
            aria-label="Delete post"
          >
            <svg
              class="card__delete-icon"
              viewBox="0 0 24 24"
              width="24"
              height="24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M3 6h18" />
              <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
              <path d="M10 11v6" />
              <path d="M14 11v6" />
            </svg>
          </button>
        </div>
        <div class="card__content">
          <h2 class="card__title"></h2>
          <button
            type="button"
            class="card__like-button"
            aria-label="Like"
            aria-pressed="false"
          >
            <svg
              class="card__like-icon"
              viewBox="0 0 24 24"
              width="24"
              height="24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M12 20.5s-7.6-4.6-9.7-9.3C.9 7.8 2.9 4 6.7 4c2.2 0 3.8 1.2 5.3 3.1C13.5 5.2 15.1 4 17.3 4c3.8 0 5.8 3.8 4.4 7.2-2.1 4.7-9.7 9.3-9.7 9.3Z"
              />
            </svg>
          </button>
        </div>
      </li>
    </template>

    <!--
      ===== MODALS =====
      All modals are hidden until JS adds the `modal_is-opened` class.
      Each one is controlled by a Popup class in pages/index.js, matched
      by its id.

      role="dialog" + aria-modal + aria-labelledby tell screen readers this
      is a dialog and which heading is its title.

      Forms:
        - `name` on each <form> is how pages/index.js finds its validator.
        - `name` on each <input> becomes the key in the submitted values
          object, and matches the API's field names (name, about, link, avatar).
        - `novalidate` turns off the browser's error bubbles so
          FormValidator.js can show inline messages instead. The rules
          themselves (required, minlength, type="url") still apply.
        - Each error <span> id must be "<input id>-error".
    -->

    <!-- Edit profile (PopupWithForm) -->
    <div
      class="modal"
      id="edit-profile-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="edit-profile-title"
    >
      <div class="modal__container">
        <button type="button" class="modal__close-button" aria-label="Close">
          <svg
            class="modal__close-icon"
            viewBox="0 0 24 24"
            width="24"
            height="24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M6 6l12 12" />
            <path d="M18 6 6 18" />
          </svg>
        </button>
        <h2 class="modal__title" id="edit-profile-title">Edit profile</h2>
        <form class="modal__form" name="edit-profile" novalidate>
          <label for="profile-name-input" class="modal__label">
            Name
            <input
              id="profile-name-input"
              type="text"
              name="name"
              class="modal__input"
              placeholder="Type your name"
              minlength="2"
              maxlength="40"
              autocomplete="name"
              required
            />
            <span id="profile-name-input-error" class="modal__error"></span>
          </label>
          <label for="profile-description-input" class="modal__label">
            Description
            <input
              id="profile-description-input"
              type="text"
              name="about"
              class="modal__input"
              placeholder="Describe yourself"
              minlength="2"
              maxlength="200"
              required
            />
            <span
              id="profile-description-input-error"
              class="modal__error"
            ></span>
          </label>
          <button type="submit" class="modal__submit-button modal__button">
            Save
          </button>
        </form>
      </div>
    </div>

    <!-- New post (PopupWithForm) -->
    <div
      class="modal"
      id="new-post-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="new-post-title"
    >
      <div class="modal__container">
        <button type="button" class="modal__close-button" aria-label="Close">
          <svg
            class="modal__close-icon"
            viewBox="0 0 24 24"
            width="24"
            height="24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M6 6l12 12" />
            <path d="M18 6 6 18" />
          </svg>
        </button>
        <h2 class="modal__title" id="new-post-title">New post</h2>
        <form class="modal__form" name="new-post" novalidate>
          <label for="card-image-input" class="modal__label">
            Image link
            <input
              id="card-image-input"
              type="url"
              name="link"
              class="modal__input"
              placeholder="https://example.com/photo.jpg"
              required
            />
            <span id="card-image-input-error" class="modal__error"></span>
          </label>
          <label for="caption-description-input" class="modal__label">
            Caption
            <input
              id="caption-description-input"
              type="text"
              name="name"
              class="modal__input"
              placeholder="Type your caption"
              minlength="2"
              maxlength="30"
              required
            />
            <span
              id="caption-description-input-error"
              class="modal__error"
            ></span>
          </label>
          <button type="submit" class="modal__submit-button modal__button">
            Save
          </button>
        </form>
      </div>
    </div>

    <!-- Change avatar (PopupWithForm) -->
    <div
      class="modal"
      id="edit-avatar-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="edit-avatar-title"
    >
      <div class="modal__container">
        <button type="button" class="modal__close-button" aria-label="Close">
          <svg
            class="modal__close-icon"
            viewBox="0 0 24 24"
            width="24"
            height="24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M6 6l12 12" />
            <path d="M18 6 6 18" />
          </svg>
        </button>
        <h2 class="modal__title" id="edit-avatar-title">Change avatar</h2>
        <form class="modal__form" name="edit-avatar" novalidate>
          <label for="avatar-link-input" class="modal__label">
            Image link
            <input
              id="avatar-link-input"
              type="url"
              name="avatar"
              class="modal__input"
              placeholder="https://example.com/avatar.jpg"
              required
            />
            <span id="avatar-link-input-error" class="modal__error"></span>
          </label>
          <button type="submit" class="modal__submit-button modal__button">
            Save
          </button>
        </form>
      </div>
    </div>

    <!-- Full-size image preview (PopupWithImage) -->
    <div
      class="modal modal_type_preview"
      id="preview-modal"
      role="dialog"
      aria-modal="true"
      aria-label="Image preview"
    >
      <figure class="modal__image-container">
        <button
          type="button"
          class="modal__close-button modal__close-button_type_preview"
          aria-label="Close preview"
        >
          <svg
            class="modal__close-icon"
            viewBox="0 0 24 24"
            width="24"
            height="24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M6 6l12 12" />
            <path d="M18 6 6 18" />
          </svg>
        </button>
        <img src="#" alt="" class="modal__image" />
        <figcaption class="modal__caption"></figcaption>
      </figure>
    </div>

    <!-- "Delete this post?" confirmation (PopupWithConfirmation).
         role="alertdialog" signals it needs a decision before continuing. -->
    <div
      class="modal"
      id="delete-modal"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="delete-title"
    >
      <div class="modal__container modal__container_type_delete">
        <button
          type="button"
          class="modal__close-button modal__close-button_type_small"
          aria-label="Close"
        >
          <svg
            class="modal__close-icon"
            viewBox="0 0 24 24"
            width="24"
            height="24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M6 6l12 12" />
            <path d="M18 6 6 18" />
          </svg>
        </button>
        <h2 class="modal__title modal__title_type_delete" id="delete-title">
          Delete this post?
        </h2>
        <p class="modal__text">This can't be undone.</p>
        <div class="modal__button-container">
          <button type="button" class="modal__button modal__button_type_delete">
            Delete
          </button>
          <button type="button" class="modal__button modal__button_type_cancel">
            Cancel
          </button>
        </div>
      </div>
    </div>

    <!-- Error messages (Toast.js). aria-live makes screen readers announce
         new text here without moving focus. -->
    <div class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
